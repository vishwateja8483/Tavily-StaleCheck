name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install .
      - name: Tests
        run: python -m pytest -q

  web:
    name: Web UI (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check packaged assessment assets match source
        run: |
          git diff --exit-code -- ../src/stalecheck/assessment_static
          test -z "$(git ls-files --others --exclude-standard ../src/stalecheck/assessment_static)"

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No key material or credential files
        run: |
          python scripts/audit-repo-readiness.py . > audit.json
          python - <<'PY'
          import json, sys
          audit = json.load(open("audit.json"))
          bad = {
              "secret_pattern_candidates": audit["secret_pattern_candidates"],
              "sensitive_filename_candidates": [p for p in audit["sensitive_filename_candidates"] if not p.endswith(".env.example")],
          }
          bad = {key: value for key, value in bad.items() if value}
          print(json.dumps({key: len(audit[key]) for key in audit if isinstance(audit[key], list)}, indent=2))
          if bad:
              print(json.dumps(bad, indent=2))
              sys.exit(1)
          PY
