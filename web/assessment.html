<!doctype html>
<html lang="en">
  <!--
    Direction contract
    THESIS: revision control for facts. The answer is marked up like an engineering drawing; red revision clouds ring the claims that may have changed.
    OWN-WORLD: cool white sheet, black linework, one revision red, a title-block cell grid, dimension lines with arrowheads. Callout shapes (circle, triangle, diamond) carry the verdicts, so colour is never the only signal.
    STORY: the reader sees which sentences are clouded, how old the best evidence is, and who did what (Bifrost, Tavily, StaleCheck), then reviews it.
    FIRST VIEWPORT: sheet frame, pipeline route across the top, answer drawing area at left, title block at right with settings, consent and the primary action.
    FORM: engineering-drawing standard; staging shown as a transit route.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' about:; object-src 'none'; form-action 'none'; base-uri 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#e8ecef" />
    <meta name="description" content="Explicitly approved, loopback-only StaleCheck assessments." />
    <title>StaleCheck — Local assessment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/assessment-main.tsx"></script>
  </body>
</html>
